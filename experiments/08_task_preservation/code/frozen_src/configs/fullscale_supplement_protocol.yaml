protocol_version: 3
status: fullscale_supplement_large_scale

# 补充实验：大参数端，专门展示同步器在大规模时的剪枝优势
# 参数全部取自 pilot_protocol_v2.yaml，取其后档/高档部分
# 与主实验（fullscale_protocol_v1.yaml）互补，共同覆盖完整参数空间

# 设计逻辑：
#   n_machines [5,6,8,10]   ← 协议后4档（主实验已覆盖前3档 [2,3,4]）
#   unobservable_ratio [0.5,0.7] ← 协议后2档（主实验已覆盖前3档 [0.1,0.3,0.5]）
#   其余参数取协议前2-3档，控制并发复杂度（不触发 concurrency cap）

repetition:
  deterministic_warmup: 0
  deterministic_repeats: 3
  simulation_seeds: 15

limits:
  timeout_seconds: 60
  memory_gb: 32

solvers:
  primary_lp: scipy_highs
  feasibility_tolerance: 1.0e-09
  optimality_tolerance: 1.0e-09

benchmark_families:
  rmt_fms:
    enabled: true
    # 直接列出本次补充实验使用的参数值（均来自协议文件）
    machine_counts:         [5, 6, 8, 10]     # 协议第4-7档
    part_type_counts:       [1, 2]             # 协议第1-2档（控制并发）
    operations_per_part:    [2, 4]             # 协议第1-2档（控制并发）
    wip_bounds:             [1]                # 协议第1档（控制并发）
    unobservable_ratios:    [0.5, 0.7]         # 协议第3-4档（高不可观测率）
    fault_locations:        [1, 2, 4]          # 协议第1-3档
    interval_width_factors: [0.5, 1.0, 1.5]   # 协议第1-3档
    adjustable_ratios:      [0.1, 0.25, 0.5]  # 协议第1-3档
  boundary:
    enabled: false

# 使用固定列表模式（不使用 param_slice，直接用上面定义的列表）
use_fixed_lists: true

methods:
  - main
  - no_sync
  - no_envelope
  - mscg_lp_adapted

concurrency_cap: 8
checkpoint_interval: 200
