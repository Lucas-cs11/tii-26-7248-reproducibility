protocol_version: 3
status: repair_experiment

# Repair 实验：对所有 AMB 唯一参数配置（2160个）各取一个 seed
# 分别使用 standard 和 extended repair domain 各跑一次
# 对比展示 repair authority 对修复成功率的影响（敏感性分析）

# repair_domains:
#   standard: 3个区间，粗粒度 ~1.0（当前默认）
#   extended: 5个区间，分辨率 0.5（含 fast-recovery [0,1] 和 delayed-recovery [3,5]）
#             对应 protocol controller_time_grids=0.5
repair_domains:
  - extended

limits:
  verify_timeout_seconds: 120
  repair_timeout_seconds: 300

verifier:
  complete_set: true
  budget: null

input_files:
  - results/fullscale/fullscale_results.json
  - results/fullscale_supplement/supplement_results.json

checkpoint_interval: 100
