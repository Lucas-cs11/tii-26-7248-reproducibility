name: validate

# Reader/reviewer CI: proves that the checked-in protocols, execution code and
# result files are internally consistent, without any paid compute.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: experiments/01_scalability_v6/code/requirements-v5.lock
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r experiments/01_scalability_v6/code/requirements-v5.lock
      - name: Unit tests (67)
        run: |
          cd experiments/01_scalability_v6/code
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate the frozen 8,280-cell protocol
        run: |
          tar -xzf experiments/01_scalability_v6/protocol/v6_formal_tasks.tar.gz \
            -C experiments/01_scalability_v6/protocol
          python experiments/01_scalability_v6/code/scripts/validate_v6_formal_protocol.py \
            --manifest experiments/01_scalability_v6/protocol/v6_formal_manifest.json \
            --tasks experiments/01_scalability_v6/protocol/v6_formal_tasks \
            --semantics-gate experiments/01_scalability_v6/protocol/v6_semantics_gate.json \
            --out /tmp/v6_validation.json
      - name: Verify the checked-in MANIFEST.sha256
        run: sha256sum -c MANIFEST.sha256
